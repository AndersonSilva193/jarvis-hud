<figure class="foto">
  @if (comImagem()) {
    <img
      class="imagem"
      [ngSrc]="dados().imagemUrl"
      fill
      sizes="100vw"
      [alt]="dados().titulo"
      referrerpolicy="no-referrer"
      priority
      (error)="aoFalharImagem()"
    />
  } @else {
    <span class="sem-foto" aria-hidden="true">// sem imagem no feed</span>
  }
  <span class="veu" aria-hidden="true"></span>
</figure>

<p class="fonte">{{ fonte() }}</p>
<h2 class="manchete">{{ dados().titulo }}</h2>

@if (linkSeguro()) { <button class="abrir-fonte" type="button" (click)="links.abrir(linkSeguro())">Abrir fonte ↗</button> }
